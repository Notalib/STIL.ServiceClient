name: Publish to nuget.org
on:
  release:
    types: [published] # Tag the release (e.g. v1.2.1); MinVer derives the package version from that tag.
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version override (e.g. 1.2.1). Leave blank to use the version MinVer computes from git tags.'
        required: false
jobs:
  publish:
    name: build, test, pack & publish
    runs-on: ubuntu-latest
    env:
      PROJECT_PATH: ./src/STIL.ServiceClient/STIL.ServiceClient.csproj
      TEST_PATH: ./src/STIL.ServiceClient.Tests/STIL.ServiceClient.Tests.csproj
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer needs the full history to find the version tag
      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install dependencies
        run: dotnet restore ${{ env.PROJECT_PATH }}
      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} -c Release --no-restore ${{ inputs.version && format('-p:MinVerVersionOverride={0}', inputs.version) || '' }}
      - name: Test
        run: dotnet test ${{ env.TEST_PATH }} -c Release
      - name: Package
        run: dotnet pack -c Release -o . ${{ env.PROJECT_PATH }} --no-build ${{ inputs.version && format('-p:MinVerVersionOverride={0}', inputs.version) || '' }}
      - name: Publish
        run: dotnet nuget push **.nupkg -k ${{ secrets.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json
